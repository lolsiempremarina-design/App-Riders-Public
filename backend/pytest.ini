[pytest]
addopts = -p no:flask
testpaths = tests
pythonpath = .
log_cli = true
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format=%Y-%m-%d %H:%M:%S
# SQLAlchemy warnings are bugs (e.g. rows deleted twice): fail the test.
# flask_login 0.6.3 (latest release) still calls datetime.utcnow() for the remember cookie.
filterwarnings =
    error::sqlalchemy.exc.SAWarning
    ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login.login_manager
