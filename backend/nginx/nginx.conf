user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    # manifest della PWA: senza questa riga usciva come application/octet-stream
    types {
        application/manifest+json webmanifest;
    }
    default_type  application/octet-stream;
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json text/csv;
    gzip_min_length 1024;
    # compressione anche per le richieste arrivate da un proxy (intestazione Via): senza, nginx manda tutto
    # non compresso (il JavaScript principale 74 KB invece di 25 KB) e il traffico del tunnel ha una quota
    gzip_proxied any;
    gzip_vary on;

    # Gestione dinamica di richieste HTTP normali e WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # L'IP vero del cliente: X-Forwarded-For è creduto solo sulla porta interna del tunnel ngrok (8444, vedi
    # templates/ror.conf.template); sulla 443 conta l'indirizzo della connessione.

    # Limite per IP su accesso, registrazione, codice di conferma dell'email e cambio/verifica password
    # (in aggiunta al blocco dopo 10 login falliti gestito da Flask con Redis)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_status 429;

    upstream flask_backend {
        server web:8000;
    }

    # Chat in tempo reale (/ws/): servizio a parte, così le chat aperte non occupano i thread dell'API
    upstream ws_backend {
        server ws:8000;
    }

    upstream fastapi_backend {
        server fastapi:8000;
    }

    # Server HTTP/HTTPS: generato all'avvio da templates/ror.conf.template con
    # SERVER_NAME, SSL_CERTIFICATE e SSL_CERTIFICATE_KEY (vedi docker-compose*.yml)
    include /etc/nginx/conf.d/ror.conf;
}
