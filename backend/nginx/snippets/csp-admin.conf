# Content Security Policy del pannello admin Flask (/web/): pagine HTML senza script né risorse esterne,
# con i QR delle bici in SVG generati dal server.
add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
