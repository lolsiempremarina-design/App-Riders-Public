# Connessioni lunghe: solo il WebSocket della chat (/ws/). Non includerlo in richieste HTTP normali:
# con 24 ore di attesa un servizio bloccato lascia il telefono appeso invece di dargli un errore.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_buffering off;
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
