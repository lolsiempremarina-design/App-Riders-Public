# Header inoltrati a Flask/FastAPI. In nginx un location che imposta proxy_set_header non eredita
# quelli del server: per questo ogni location di proxy include questo file.
# $http_host (non $host): con una porta diversa da 443 (es. https://localhost:8443 dall'emulatore Android)
# Flask deve vedere la stessa origine del browser, altrimenti falliscono il controllo CSRF sul Referer
# e quello dell'Origin del WebSocket.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
