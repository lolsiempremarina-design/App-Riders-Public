# Il sito RoR (frontend React, API Flask, chat, ingestione FastAPI, pannello admin): incluso dai due server HTTPS
# di templates/ror.conf.template, quello pubblico (443) e quello del tunnel ngrok (8444).

include /etc/nginx/snippets/security-headers.conf;

# Risposta JSON (come le altre dell'API) quando scatta il limite di richieste
location @too_many_requests {
    default_type application/json;
    return 429 '{"error": "too_many_requests", "message": "Too many requests. Try again in a minute."}';
}

# ------------------------------------------------------------------
# FastAPI: blocchi di punti GPS (POST) e chiusura sessione
# ------------------------------------------------------------------
# /stream è un POST normale, non un WebSocket: prima includeva websocket.conf e quindi aspettava FastAPI
# fino a 24 ore (proxy_read_timeout 86400s). Con FastAPI bloccato, il telefono restava appeso invece di
# ricevere un errore e tenersi i punti per il prossimo invio. Ora vale il tempo predefinito di nginx (60 s).
location /stream {
    proxy_pass http://fastapi_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location /session/ {
    proxy_pass http://fastapi_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# ------------------------------------------------------------------
# Flask: API JSON per React (/api/...) e WebSocket (/ws/...)
# ------------------------------------------------------------------
location ~ ^/api/(auth/(login|register|delete-account|confirm-email(/resend)?)|profile/password)$ {
    limit_req zone=auth burst=20 nodelay;
    error_page 429 = @too_many_requests;
    proxy_pass http://flask_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location /api/ {
    proxy_pass http://flask_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location /ws/ {
    proxy_pass http://ws_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/websocket.conf;
}

# App Links dell'app Android (link d'invito e QR delle bici aprono l'app): generato da Flask
# con ANDROID_APP_ID e ANDROID_CERT_SHA256; senza impronte risponde 404
location = /.well-known/assetlinks.json {
    proxy_pass http://flask_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Pannello admin Flask (ordini e bici) sotto /web/: l'accesso si fa dall'app React, che imposta
# lo stesso cookie di sessione (Flask genera i link con il prefisso grazie a X-Forwarded-Prefix + ProxyFix).
location = /web {
    return 301 /web/;
}

# Solo /web/ e /web/admin/...: API e chat di Flask passano soltanto da /api/ e /ws/, dove valgono i limiti
# qui sopra (prima /web/api/auth/login arrivava a Flask senza il limite sui tentativi di accesso).
location ~ ^/web/(admin(/.*)?)?$ {
    rewrite ^/web(/.*)$ $1 break;
    proxy_pass http://flask_backend;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header X-Forwarded-Prefix /web;
    # un location con add_header proprio non eredita quelli del server: si includono di nuovo
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-admin.conf;
}

location /web/ {
    return 404;
}

# ------------------------------------------------------------------
# Frontend React (build statica di Vite) con fallback SPA
# ------------------------------------------------------------------
root /usr/share/nginx/html;
index index.html;

# Service worker e manifest: sempre aggiornati
location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    expires -1;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;
    try_files $uri =404;
}

# File con hash generati da Vite (il nome cambia quando cambia il contenuto): cache di un anno
location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# Icone dell'app (favicon e PWA, cambiano di rado): la WebView dell'app Android richiede la favicon a ogni
# cambio di pagina e senza cache ogni richiesta attraversava il tunnel (quota di ngrok gratis)
location /icons/ {
    expires 1d;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location / {
    expires -1;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;
    try_files $uri $uri/ /index.html;
}
