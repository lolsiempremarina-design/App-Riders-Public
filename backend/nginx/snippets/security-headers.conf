# Header di sicurezza comuni. Un location con add_header proprio non eredita questi:
# i location dell'app React includono di nuovo questo file (più la CSP).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# sensori e posizione solo per questo sito (tracciamento GPS e rilevamento cadute)
add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), camera=(), microphone=(), payment=(), usb=()" always;
