# Content Security Policy dell'app React (il pannello admin /web/ ha la sua: csp-admin.conf).
# Servizi esterni ammessi = quelli elencati nella pagina Privacy dell'app:
# tessere e ricerca OpenStreetMap, meteo Open-Meteo, bandiere (flagcdn). Comuni e QR vengono dal sito stesso.
# connect-src include le tessere perché le scarica anche il service worker (cache della mappa).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://flagcdn.com; font-src 'self' data:; connect-src 'self' wss://$host https://tile.openstreetmap.org https://api.open-meteo.com https://nominatim.openstreetmap.org; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
