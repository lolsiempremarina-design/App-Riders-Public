# Soglie di RabbitMQ per il PC usato come server (unito a quello che genera l'immagine in conf.d).
#
# Senza queste, se il gps_worker si ferma la coda cresce finché il disco si riempie: i valori
# predefiniti fermano chi pubblica solo con 50 MB di disco liberi, troppo tardi su un PC vero.
# Superata una soglia RabbitMQ blocca chi pubblica invece di accumulare: FastAPI risponde 503 dopo
# 10 s (blocked_connection_timeout in fastapi_app/main.py) e il telefono si tiene i punti per il
# prossimo invio.

disk_free_limit.absolute = 2GB

# Assoluta e non relativa: RabbitMQ qui non vede il mem_limit del container e calcolerebbe la
# percentuale sulla memoria di tutto il PC (0.6 diventava 9,9 GB, cioè mai), così Docker avrebbe
# chiuso il container per memoria esaurita prima che RabbitMQ rallentasse chi pubblica.
# Circa il 60% di mem_limit: 768m: se cambia quello, cambiare anche questo.
vm_memory_high_watermark.absolute = 450MB
